name: Tarifa Radar - busqueda gratuita

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/searches.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: free-hotel-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar el scraper
        run: npm install --no-audit --no-fund

      - name: Buscar precios
        run: xvfb-run -a node src/repository-scan.cjs

      - name: Enviar alertas a Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/send-telegram.cjs

      - name: Publicar resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/publish-results.cjs
